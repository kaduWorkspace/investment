{{ define "base_new" }}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Fin Σ</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <style>
body {
    font-family: 'Roboto', sans-serif;
}
        </style>
    </head>
    <body class="min-h-screen bg-gray-50 flex flex-col">
        <!-- Header com Navegação -->
        {{ template "header_new" }}
        <div class="flex flex-1">
            <nav id="menu-container" class="hidden lg:flex flex-col w-64 bg-white border-r border-slate-200">
                {{ template "menu" }}
            </nav>
            <nav id="menu-container-mobile" class="hidden absolute z-50 bg-white w-full border-b border-slate-300 p-4 lg:hidden">
                {{ template "menu" }}
            </nav>

            <main  id="main-content" class="flex-1 p-6 bg-white overflow-y-auto">
                <h1 class="text-2xl font-bold text-slate-800 mb-4">Bem-vindo ao Fin Σ</h1>
                <p class="text-slate-600">Aqui você pode simular e planejar seus investimentos com facilidade.</p>
            </main>
        </div>

        {{ template "footer_new" }}
    </body>
    <script src="/public/scripts/htmx.min.js"></script>
    <script type="module" src="/public/scripts/main.js"></script>
    <script type="module" src="/public/scripts/formInitializer.js"></script>
    <script type="module" src="/public/scripts/inputUtils.js"></script>
    <script type="module" src="/public/scripts/predict_form.js"></script>
    <script type="module" src="/public/scripts/financasPage.js"></script>
    <script type="module" src="/public/scripts/signupPage.js"></script>
    <script type="module" src="/public/scripts/signinPage.js"></script>
    <script type="module" src="/public/scripts/menu.js"></script>
</html>
{{ end }}
