{{ define "dashboard" }}
<div class="w-11/12 md:w-5/6 mx-auto mt-6 animate-fade-in">
    <!-- Header do Dashboard -->
    <div class="text-center mb-8">
        <h1 class="text-3xl sm:text-4xl font-bold text-teal-400 mb-2">
            Dashboard Financeiro
        </h1>
        <p class="text-gray-400 text-sm sm:text-base">
            Gerencie seus investimentos e simulações financeiras
        </p>
    </div>

    <!-- Botões de Navegação Fixos -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
        <!-- Botão Simular Investimento -->
        <button class="card p-6 rounded-xl bg-gradient-to-br from-blue-900 to-blue-800 shadow-lg text-white hover:from-blue-800 hover:to-blue-700 transition-all duration-300 transform hover:scale-105 cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500"
                hx-get="/web/dashboard/fv"
                hx-swap="innerHTML"
                hx-target="#dynamic-content">
            <div class="flex items-center mb-4">
                <div class="w-12 h-12 bg-blue-600 rounded-lg flex items-center justify-center mr-4">
                    <img class="w-8 h-8" src="/public/images/icons8-money-48.png" alt="Simular">
                </div>
                <div>
                    <h3 class="text-xl font-semibold text-white mb-1">Simular Investimento</h3>
                    <p class="text-blue-200 text-sm">Calcule rendimentos futuros</p>
                </div>
            </div>
            <div class="flex items-center justify-between">
                <span class="text-blue-200 text-sm">Clique para simular</span>
                <img class="w-5 h-5" src="/public/images/icons8-up-64.png" alt="Arrow">
            </div>
        </button>

        <!-- Botão Prever Aporte -->
        <button class="card p-6 rounded-xl bg-gradient-to-br from-orange-900 to-orange-800 shadow-lg text-white hover:from-orange-800 hover:to-orange-700 transition-all duration-300 transform hover:scale-105 cursor-pointer focus:outline-none focus:ring-2 focus:ring-orange-500"
                hx-get="/web/dashboard/predict"
                hx-swap="innerHTML"
                hx-target="#dynamic-content">
            <div class="flex items-center mb-4">
                <div class="w-12 h-12 bg-orange-600 rounded-lg flex items-center justify-center mr-4">
                    <img class="w-8 h-8" src="/public/images/saco-dinheiro.svg" alt="Prever">
                </div>
                <div>
                    <h3 class="text-xl font-semibold text-white mb-1">Prever Aporte</h3>
                    <p class="text-orange-200 text-sm">Planeje seus aportes mensais</p>
                </div>
            </div>
            <div class="flex items-center justify-between">
                <span class="text-orange-200 text-sm">Clique para começar</span>
                <img class="w-5 h-5" src="/public/images/icons8-up-64.png" alt="Arrow">
            </div>
        </button>
    </div>

    <!-- Container Dinâmico -->
    <div id="dynamic-content" class="min-h-96 bg-gray-900 rounded-xl shadow-lg p-6 border border-gray-700">
        <!-- Conteúdo inicial ou mensagem de boas-vindas -->
        <div class="text-center py-12">
            <div class="mb-4">
                <img class="w-16 h-16 mx-auto opacity-50" src="/public/images/icons8-money-48.png" alt="Selecione">
            </div>
            <h3 class="text-xl font-semibold text-gray-400 mb-2">Selecione uma opção acima</h3>
            <p class="text-gray-500 text-sm">Clique em um dos botões para começar a usar as ferramentas financeiras</p>
        </div>
    </div>
</div>
{{ end }}
