{{ define "header_new" }}
<header class="w-full border-b border-slate-300 bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
        <div class="flex items-center w-full lg:justify-center justify-between">
            <button id="hamburguer-menu" class="lg:hidden">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="32"
                    height="32"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="#000000"
                    stroke-width="0.75"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="w-8 h-8"
                    >
                    <path d="M4 6l16 0" />
                    <path d="M4 12l16 0" />
                    <path d="M4 18l16 0" />
                </svg>
            </button>
            <button id="hamburguer-menu-close" class="lg:hidden hidden p-0 m-0 ">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="32"
                    height="32"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="#000000"
                    stroke-width="0.75"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="w-8 h-8"
                    >
                    <path d="M18 6l-12 12" />
                    <path d="M6 6l12 12" />
                </svg>
            </button>
            <div class="flex">
                <svg width="100" height="40" viewBox="0 0 95 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="0" y="20" width="6" height="20" fill="#1e293b" />
                    <rect x="10" y="10" width="6" height="30" fill="#0ea5e9" />
                    <rect x="20" y="5" width="6" height="35" fill="#22c55e" />
                    <text x="35" y="28" font-size="22" fill="#1e293b" font-weight="bold">Fin</text>
                    <text x="78" y="28" font-size="20" fill="#0ea5e9">Σ</text>
                </svg>
            </div>
        </div>
    </div>
</header>
{{ end }}
